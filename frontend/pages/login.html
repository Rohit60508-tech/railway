<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Access Gateway — RAKSHA PATH | Indian Railways AI Command</title>
  <meta name="description"
    content="Official Indian Railways AI-Powered Automatic Block Planning & Corridor Command Access Gateway." />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
    rel="stylesheet" />

  <!-- User Store -->
  <script src="../components/user-store.js"></script>

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --navy: #003366;
      --blue: #0056B3;
      --saffron: #F97316;
      --saffron-dark: #EA580C;
      --emerald: #059669;
      --dark-card: rgba(15, 23, 42, 0.72);
      --border-card: rgba(255, 255, 255, 0.16);
    }

    html,
    body {
      min-height: 100%;
      height: 100%;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #F8FAFC;
      overflow-x: hidden;
      background-color: #030712;
    }

    #app-container {
      min-height: 100vh;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background-image: linear-gradient(135deg, rgba(3, 7, 18, 0.70) 0%, rgba(15, 23, 42, 0.50) 50%, rgba(3, 7, 18, 0.80) 100%), url('../vande_bharat_bg.jpg'), url('/frontend/vande_bharat_bg.jpg'), url('/vande_bharat_bg.jpg');
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      background-attachment: fixed;
      position: relative;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-fade-in {
      animation: fadeIn 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Custom input focus styles */
    .gov-input {
      width: 100%;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: rgba(15, 23, 42, 0.65);
      font-size: 0.88rem;
      color: #FFFFFF;
      outline: none;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
      font-family: inherit;
      transition: all 0.18s ease;
    }

    .gov-input:focus {
      border-color: #F97316 !important;
      background: rgba(15, 23, 42, 0.85) !important;
      box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.22), inset 0 2px 4px rgba(0, 0, 0, 0.3) !important;
    }

    .role-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.13);
      cursor: pointer;
      transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
      text-decoration: none;
      user-select: none;
    }

    .role-card:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
    }

    .role-icon-box {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.20);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      flex-shrink: 0;
    }

    .btn-back {
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      padding: 5px 10px;
      color: #E2E8F0;
      font-weight: 700;
      font-size: 0.74rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-back:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    .submit-btn {
      width: 100%;
      padding: 11px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(135deg, #F97316 0%, #EA580C 100%);
      color: #FFFFFF;
      font-size: 0.90rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(249, 115, 22, 0.35);
      letter-spacing: 0.3px;
      transition: all 0.18s ease;
    }

    .submit-btn:hover {
      box-shadow: 0 8px 24px rgba(249, 115, 22, 0.55);
      transform: translateY(-1px);
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.5);
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
    }
  </style>
</head>

<body>
  <div id="app-container">
    <div id="login-card" style="
      width: 100%;
      max-width: 510px;
      background: rgba(15, 23, 42, 0.72);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.20);
      padding: 26px 28px;
      color: #F8FAFC;
      position: relative;
    ">
      <!-- Dynamic Views injected here -->
      <div id="view-root" class="animate-fade-in"></div>

      <!-- Card Footer -->
      <div style="
        margin-top: 18px;
        padding-top: 14px;
        border-top: 1px solid rgba(255, 255, 255, 0.09);
        text-align: center;
        font-size: 0.68rem;
        color: #94A3B8;
        line-height: 1.5;
      ">
        <div>Access restricted to authorized Indian Railways personnel.</div>
        <div style="color: #64748B; margin-top: 2px;">RAKSHA PATH v2.4.1 · High-Speed Corridor Command</div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      const SESSION_KEY = 'ir_auth_session';
      const TOKEN_KEY = 'ir_auth_token';

      const urlParams = new URLSearchParams(window.location.search);
      const isLogout = urlParams.get('logout') === 'true';
      const isReloadSecurity = urlParams.get('reason') === 'reload_security';
      const redirectUrl = urlParams.get('redirect') || null;

      if (isLogout || isReloadSecurity) {
        try {
          sessionStorage.removeItem(SESSION_KEY);
          sessionStorage.removeItem(TOKEN_KEY);
          localStorage.removeItem(SESSION_KEY);
          localStorage.removeItem('token');
          localStorage.removeItem(TOKEN_KEY);
        } catch (_) { }
      }

      // 1. Primary Command Authorities Catalog
      const MAIN_ROLES = [
        {
          key: 'admin',
          label: 'Executive / Admin',
          icon: '🛡️',
          color: '#38BDF8',
          dept: 'Chief Controller & Executive Admin - DOM',
          route: 'admin-dashboard.html',
          desc: 'High-speed corridor oversight, policy overrides, AI model retraining & user governance'
        },
        {
          key: 'field-maintenance-group',
          label: 'Field Engineer (Maintenance)',
          icon: '🔧',
          color: '#FBBF24',
          dept: 'Track (TMS), Signal (SMMS) & Traction (TRD)',
          isMaintenanceGroup: true,
          desc: 'Track possessions, ultrasonic flaw verifications, gang dispatch & work order completion'
        },
        {
          key: 'control-office',
          label: 'Control Office Controller',
          icon: '🎛️',
          color: '#60A5FA',
          dept: 'Section Controller · Traffic & Operations',
          route: 'control-office.html',
          desc: 'Real-time automatic block granting, train sequencing & overhead traction power isolation'
        },
        {
          key: 'surveillance',
          label: 'Surveillance Inspector',
          icon: '📡',
          color: '#34D399',
          dept: 'Track Safety & Telemetry Specialist',
          route: 'surveillance-dashboard.html',
          desc: 'Optical drone video analytics, vibration accelerometers & intrusion detection telemetry'
        }
      ];

      // 2. Specialized Maintenance Engineering Departments
      const MAINTENANCE_DEPARTMENTS = [
        {
          key: 'field-tms',
          label: 'TMS — Track Maintenance Dept',
          shortLabel: 'TMS (Track / P-Way)',
          icon: '🛤️',
          color: '#F59E0B',
          dept: 'Track Maintenance System (P-Way, Gang & Machines)',
          route: 'maintenance-dashboard.html',
          roleFilter: ['field-tms', 'field-engineer', 'admin']
        },
        {
          key: 'field-smms',
          label: 'SMMS — Signal & Telecom Dept',
          shortLabel: 'SMMS (Signal & S&T)',
          icon: '🚦',
          color: '#0284C7',
          dept: 'Signal Maintenance Management System (Interlocking & Points)',
          route: 'maintenance-dashboard.html',
          roleFilter: ['field-smms', 'field-engineer', 'admin']
        },
        {
          key: 'field-trd',
          label: 'TRD — Traction Distribution Dept',
          shortLabel: 'TRD (Traction & OHE)',
          icon: '⚡',
          color: '#EAB308',
          dept: 'Traction Power Supply & Overhead Equipment (OHE)',
          route: 'maintenance-dashboard.html',
          roleFilter: ['field-trd', 'field-engineer', 'admin']
        },
        {
          key: 'field-engineer',
          label: 'Senior Section Engineer (In-Charge)',
          shortLabel: 'Field Engineer (General / SSE)',
          icon: '🔧',
          color: '#D97706',
          dept: 'Multi-Disciplinary Maintenance & Section In-Charge',
          route: 'maintenance-dashboard.html',
          roleFilter: ['field-engineer', 'admin']
        }
      ];

      // Application State
      let viewMode = 'main'; // 'main' | 'maintenance' | 'form'
      let selectedRole = null;
      let username = '';
      let password = '';
      let showPassword = false;
      let error = '';
      let success = '';
      let loading = false;

      const viewRoot = document.getElementById('view-root');

      function escapeHtml(str) {
        if (!str) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function render() {
        if (!viewRoot) return;
        viewRoot.className = 'animate-fade-in';

        if (viewMode === 'main') {
          renderMain();
        } else if (viewMode === 'maintenance') {
          renderMaintenance();
        } else if (viewMode === 'form' && selectedRole) {
          renderForm();
        }
      }

      function renderMain() {
        let html = '';

        if (isReloadSecurity) {
          html += `
            <div style="
              margin-bottom: 14px;
              padding: 10px 12px;
              border-radius: 10px;
              background: rgba(249, 115, 22, 0.16);
              border: 1px solid rgba(249, 115, 22, 0.45);
              color: #FDBA74;
              font-size: 0.75rem;
              line-height: 1.4;
              display: flex;
              align-items: center;
              gap: 8px;
            ">
              <span style="font-size: 1.1rem; flex-shrink: 0;">🔒</span>
              <div>
                <strong style="color: #FED7AA; display: block;">High-Security Protocol Active</strong>
                Active session terminated upon page reload as per Railway Security Protocol. Please select your role to sign in.
              </div>
            </div>
          `;
        }

        html += `
          <div style="text-align: center; margin-bottom: 18px;">
            <div style="
              display: inline-flex;
              align-items: center;
              gap: 6px;
              font-size: 0.68rem;
              font-weight: 800;
              color: #F97316;
              letter-spacing: 1px;
              text-transform: uppercase;
              background: rgba(249, 115, 22, 0.15);
              border: 1px solid rgba(249, 115, 22, 0.35);
              padding: 4px 12px;
              border-radius: 16px;
              box-shadow: 0 2px 6px rgba(249, 115, 22, 0.12);
            ">
              <span>🛡️</span>
              <span>Indian Railways Access Gateway</span>
            </div>
            <h1 style="font-size: 1.45rem; font-weight: 800; color: #FFFFFF; margin-top: 10px; letter-spacing: 0.2px;">
              Select Access Role
            </h1>
            <p style="font-size: 0.80rem; color: #CBD5E1; margin-top: 4px; line-height: 1.4;">
              Choose your operational command authority to enter the platform.
            </p>
          </div>

          <div style="display: flex; flex-direction: column; gap: 9px;">
        `;

        MAIN_ROLES.forEach(r => {
          html += `
            <div class="role-card" data-key="${r.key}" style="border-left: 3px solid ${r.color};">
              <div style="display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1;">
                <div class="role-icon-box">${r.icon}</div>
                <div style="min-width: 0; flex: 1; overflow: hidden;">
                  <div style="font-size: 0.90rem; font-weight: 700; color: #FFFFFF; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
                    ${escapeHtml(r.label)}
                  </div>
                  <div style="font-size: 0.71rem; color: #94A3B8; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
                    ${escapeHtml(r.dept)}
                  </div>
                </div>
              </div>
              <div style="display: flex; align-items: center; gap: 4px; font-size: 0.76rem; font-weight: 700; color: #60A5FA; flex-shrink: 0; white-space: nowrap; margin-left: 12px;">
                <span>Sign In</span>
                <span style="font-size: 0.88rem; line-height: 1;">→</span>
              </div>
            </div>
          `;
        });

        html += `</div>`;
        viewRoot.innerHTML = html;

        // Bind clicks
        viewRoot.querySelectorAll('.role-card').forEach(card => {
          card.addEventListener('click', () => {
            const key = card.getAttribute('data-key');
            const role = MAIN_ROLES.find(r => r.key === key);
            if (!role) return;

            if (role.isMaintenanceGroup) {
              viewMode = 'maintenance';
              error = '';
              render();
            } else {
              selectedRole = role;
              viewMode = 'form';
              username = '';
              password = '';
              error = '';
              success = '';
              render();
            }
          });
        });
      }

      function renderMaintenance() {
        let html = `
          <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px;">
            <button type="button" id="btn-back-to-main" class="btn-back">
              <span>←</span>
              <span>Back to Access Roles</span>
            </button>
            <div style="
              padding: 4px 11px;
              border-radius: 16px;
              background: rgba(245, 158, 11, 0.15);
              border: 1px solid rgba(245, 158, 11, 0.4);
              color: #FBBF24;
              font-weight: 700;
              font-size: 0.74rem;
            ">
              🔧 Maintenance Wing
            </div>
          </div>

          <div style="margin-bottom: 16px; text-align: center;">
            <h2 style="font-size: 1.30rem; font-weight: 800; color: #FFFFFF; letter-spacing: 0.2px;">
              Select Maintenance Department
            </h2>
            <p style="font-size: 0.78rem; color: #CBD5E1; margin-top: 3px; line-height: 1.4;">
              Choose your specialized field engineering authority:
            </p>
          </div>

          <div style="display: flex; flex-direction: column; gap: 9px;">
        `;

        MAINTENANCE_DEPARTMENTS.forEach(d => {
          html += `
            <div class="role-card" data-key="${d.key}" style="border-left: 3px solid ${d.color};">
              <div style="display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1;">
                <div class="role-icon-box">${d.icon}</div>
                <div style="min-width: 0; flex: 1; overflow: hidden;">
                  <div style="font-size: 0.90rem; font-weight: 700; color: #FFFFFF; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
                    ${escapeHtml(d.label)}
                  </div>
                  <div style="font-size: 0.70rem; color: #94A3B8; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
                    ${escapeHtml(d.dept)}
                  </div>
                </div>
              </div>
              <div style="display: flex; align-items: center; gap: 4px; font-size: 0.76rem; font-weight: 700; color: #60A5FA; flex-shrink: 0; white-space: nowrap; margin-left: 12px;">
                <span>Sign In</span>
                <span style="font-size: 0.88rem; line-height: 1;">→</span>
              </div>
            </div>
          `;
        });

        html += `</div>`;
        viewRoot.innerHTML = html;

        document.getElementById('btn-back-to-main')?.addEventListener('click', () => {
          viewMode = 'main';
          render();
        });

        viewRoot.querySelectorAll('.role-card').forEach(card => {
          card.addEventListener('click', () => {
            const key = card.getAttribute('data-key');
            const dept = MAINTENANCE_DEPARTMENTS.find(d => d.key === key);
            if (!dept) return;

            selectedRole = dept;
            viewMode = 'form';
            username = '';
            password = '';
            error = '';
            success = '';
            render();
          });
        });
      }

      function renderForm() {
        const titleLabel = selectedRole.shortLabel || selectedRole.label;
        let html = `
          <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px;">
            <button type="button" id="btn-back-form" class="btn-back">
              <span>←</span>
              <span>Change Authority</span>
            </button>
            <div style="
              display: flex;
              align-items: center;
              gap: 6px;
              padding: 4px 11px;
              border-radius: 16px;
              background: rgba(255, 255, 255, 0.12);
              border: 1px solid ${selectedRole.color};
              color: #FFFFFF;
              font-weight: 700;
              font-size: 0.74rem;
            ">
              <span>${selectedRole.icon}</span>
              <span>${escapeHtml(titleLabel)}</span>
            </div>
          </div>

          <div style="margin-bottom: 16px;">
            <h2 style="font-size: 1.30rem; font-weight: 800; color: #FFFFFF; letter-spacing: 0.2px;">
              Sign In as ${escapeHtml(titleLabel)}
            </h2>
            <p style="font-size: 0.78rem; color: #94A3B8; margin-top: 3px; line-height: 1.4;">
              Enter your authorized credentials for ${escapeHtml(selectedRole.dept)}.
            </p>
          </div>

          <form id="login-form">
            <div style="margin-bottom: 12px;">
              <label style="
                display: block;
                font-size: 0.70rem;
                font-weight: 700;
                color: #CBD5E1;
                text-transform: uppercase;
                letter-spacing: 0.7px;
                margin-bottom: 6px;
              ">Username / Employee ID</label>
              <input
                type="text"
                id="input-username"
                class="gov-input"
                placeholder="Enter official username / employee ID"
                value="${escapeHtml(username)}"
                autocomplete="username"
                required
              />
            </div>

            <div style="margin-bottom: 16px;">
              <div style="
                display: flex;
                align-items: center;
                justify-content: space-between;
                font-size: 0.70rem;
                font-weight: 700;
                color: #CBD5E1;
                text-transform: uppercase;
                letter-spacing: 0.7px;
                margin-bottom: 6px;
              ">
                <span>Password</span>
                <button type="button" id="btn-toggle-pwd" style="
                  background: transparent;
                  border: none;
                  color: #94A3B8;
                  cursor: pointer;
                  font-size: 0.70rem;
                  font-weight: 600;
                ">${showPassword ? 'Hide' : 'Show'}</button>
              </div>
              <input
                type="${showPassword ? 'text' : 'password'}"
                id="input-password"
                class="gov-input"
                placeholder="Enter official password"
                value="${escapeHtml(password)}"
                autocomplete="current-password"
                required
              />
            </div>

            <div id="error-container"></div>
            <div id="success-container"></div>

            <button type="submit" id="btn-submit" class="submit-btn" ${loading ? 'disabled' : ''}>
              ${loading ? 'Authenticating Officer Credentials...' : 'Sign In to Corridor Command →'}
            </button>
          </form>
        `;

        viewRoot.innerHTML = html;

        // Auto-focus username
        const userInput = document.getElementById('input-username');
        if (userInput && !username) userInput.focus();

        // Update error/success UI
        updateNoticeContainers();

        // Bind events
        document.getElementById('btn-back-form')?.addEventListener('click', () => {
          if (selectedRole && selectedRole.key.startsWith('field-')) {
            viewMode = 'maintenance';
          } else {
            viewMode = 'main';
          }
          selectedRole = null;
          username = '';
          password = '';
          error = '';
          success = '';
          render();
        });

        document.getElementById('btn-toggle-pwd')?.addEventListener('click', () => {
          showPassword = !showPassword;
          const pwdInput = document.getElementById('input-password');
          if (pwdInput) {
            pwdInput.type = showPassword ? 'text' : 'password';
          }
          const btn = document.getElementById('btn-toggle-pwd');
          if (btn) btn.textContent = showPassword ? 'Hide' : 'Show';
        });

        const form = document.getElementById('login-form');
        if (form) {
          form.addEventListener('submit', (ev) => {
            ev.preventDefault();
            const u = document.getElementById('input-username')?.value || '';
            const p = document.getElementById('input-password')?.value || '';
            handleFormSubmit(u, p);
          });
        }
      }

      function updateNoticeContainers() {
        const errorContainer = document.getElementById('error-container');
        if (errorContainer) {
          if (error) {
            errorContainer.innerHTML = `
              <div style="
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 10px 12px;
                border-radius: 9px;
                background: rgba(220, 38, 38, 0.22);
                border: 1px solid rgba(220, 38, 38, 0.45);
                color: #FCA5A5;
                font-size: 0.78rem;
                font-weight: 600;
                margin-bottom: 14px;
              ">
                <span>⚠️</span>
                <span>${escapeHtml(error)}</span>
              </div>
            `;
          } else {
            errorContainer.innerHTML = '';
          }
        }

        const successContainer = document.getElementById('success-container');
        if (successContainer) {
          if (success) {
            successContainer.innerHTML = `
              <div style="
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 10px 12px;
                border-radius: 9px;
                background: rgba(16, 185, 129, 0.22);
                border: 1px solid rgba(16, 185, 129, 0.45);
                color: #6EE7B7;
                font-size: 0.78rem;
                font-weight: 600;
                margin-bottom: 14px;
              ">
                <span>✓</span>
                <span>${escapeHtml(success)}</span>
              </div>
            `;
          } else {
            successContainer.innerHTML = '';
          }
        }
      }

      function handleFormSubmit(u, p) {
        username = u.trim();
        password = p;
        error = '';
        success = '';

        if (!selectedRole) {
          error = 'Please select an operational access role first.';
          updateNoticeContainers();
          return;
        }
        if (!username) {
          error = 'Please enter your official username or Employee ID.';
          updateNoticeContainers();
          return;
        }
        if (!password) {
          error = 'Please enter your password.';
          updateNoticeContainers();
          return;
        }

        loading = true;
        const submitBtn = document.getElementById('btn-submit');
        if (submitBtn) {
          submitBtn.disabled = true;
          submitBtn.textContent = 'Authenticating Officer Credentials...';
        }

        setTimeout(() => {
          try {
            let user = null;
            if (window.IR_UserStore && typeof window.IR_UserStore.authenticate === 'function') {
              user = window.IR_UserStore.authenticate(username, password);
            }

            if (!user) {
              error = 'Invalid credentials. Please verify your username and password.';
              loading = false;
              if (submitBtn) {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Sign In to Corridor Command →';
              }
              updateNoticeContainers();
              return;
            }

            // Verify role permission
            const allowedRoles = selectedRole.roleFilter || [selectedRole.key, 'admin'];
            if (!allowedRoles.includes(user.role) && user.role !== 'admin') {
              error = `Officer account '${user.username}' is assigned to role '${user.role}', which does not match '${selectedRole.label}'.`;
              loading = false;
              if (submitBtn) {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Sign In to Corridor Command →';
              }
              updateNoticeContainers();
              return;
            }

            // Create session payload
            const sessionData = {
              username: user.username,
              role: user.role,
              name: user.name || selectedRole.label,
              division: user.division || 'Northern Zone',
              loginTime: Date.now()
            };

            try {
              sessionStorage.setItem(SESSION_KEY, JSON.stringify(sessionData));
              sessionStorage.setItem(TOKEN_KEY, 'ir_tok_' + Math.random().toString(36).substring(2));
              localStorage.setItem(SESSION_KEY, JSON.stringify(sessionData));
              localStorage.setItem(TOKEN_KEY, 'ir_tok_' + Math.random().toString(36).substring(2));
            } catch (_) { }

            success = `Access Authorized: Welcome, ${sessionData.name}. Launching Command Console...`;
            updateNoticeContainers();

            const targetRoute = redirectUrl || 'getting-started.html';
            setTimeout(() => {
              window.location.replace(targetRoute);
            }, 50);

          } catch (err) {
            error = err.message || 'Authentication error encountered.';
            loading = false;
            if (submitBtn) {
              submitBtn.disabled = false;
              submitBtn.textContent = 'Sign In to Corridor Command →';
            }
            updateNoticeContainers();
          }
        }, 30);
      }

      // Initial Mount
      render();
    })();
  </script>
</body>

</html>
