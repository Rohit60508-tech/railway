<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Access Gateway — RAKSHA PATH | Indian Railways AI Command</title>
  <meta name="description"
    content="Official Indian Railways AI-Powered Automatic Block Planning & Corridor Command Access Gateway." />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
    rel="stylesheet" />

  <!-- User Store -->
  <script src="../components/user-store.js"></script>

  <!-- React 18 & ReactDOM 18 (Local bundle with CDN fallback) -->
  <script src="/node_modules/react/umd/react.production.min.js"></script>
  <script src="/node_modules/react-dom/umd/react-dom.production.min.js"></script>
  <script>
    if (!window.React || !window.ReactDOM) {
      document.write('<script src="https://unpkg.com/react@18/umd/react.production.min.js"><\/script>');
      document.write('<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"><\/script>');
    }
  </script>

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --navy: #003366;
      --blue: #0056B3;
      --saffron: #F97316;
      --saffron-dark: #EA580C;
      --emerald: #059669;
      --dark-card: rgba(15, 23, 42, 0.72);
      --border-card: rgba(255, 255, 255, 0.16);
    }

    html,
    body {
      min-height: 100%;
      height: 100%;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #F8FAFC;
      overflow-x: hidden;
      background-color: #030712;
    }

    #root {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .animate-fade-in {
      animation: fadeIn 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Custom input focus styles */
    .gov-input:focus {
      border-color: #F97316 !important;
      background: rgba(15, 23, 42, 0.85) !important;
      box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.22), inset 0 2px 4px rgba(0, 0, 0, 0.3) !important;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.5);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <script>
    (function () {
      'use strict';

      // ═══════════════════════════════════════════════════════════════════════
      // HIGH-SECURITY PROTOCOL: PURGE SESSION ON PAGE RELOAD / REFRESH
      // ═══════════════════════════════════════════════════════════════════════
      const SESSION_KEY = 'ir_auth_session';
      const TOKEN_KEY = 'ir_auth_token';

      try {
        const navEntries = performance.getEntriesByType ? performance.getEntriesByType('navigation') : [];
        const isReload = (navEntries.length > 0 && navEntries[0].type === 'reload') ||
                         (window.performance && window.performance.navigation && window.performance.navigation.type === 1);
        if (isReload) {
          sessionStorage.removeItem(SESSION_KEY);
          sessionStorage.removeItem(TOKEN_KEY);
        }
      } catch (_) {}

      const urlParams = new URLSearchParams(window.location.search);
      const isReloadSecurity = urlParams.get('reason') === 'reload_security';
      const redirectUrl = urlParams.get('redirect') || null;

      // 1. Primary Command Authorities Catalog
      const MAIN_ROLES = [
        {
          key: 'admin',
          label: 'Executive / Admin',
          icon: '🛡️',
          color: '#38BDF8',
          dept: 'Chief Controller & Executive Admin - DOM',
          route: 'admin-dashboard.html',
          desc: 'High-speed corridor oversight, policy overrides, AI model retraining & user governance'
        },
        {
          key: 'field-maintenance-group',
          label: 'Field Engineer (Maintenance)',
          icon: '🔧',
          color: '#FBBF24',
          dept: 'Track (TMS), Signal (SMMS) & Traction (TRD)',
          isMaintenanceGroup: true,
          desc: 'Track possessions, ultrasonic flaw verifications, gang dispatch & work order completion'
        },
        {
          key: 'control-office',
          label: 'Control Office Controller',
          icon: '🎛️',
          color: '#60A5FA',
          dept: 'Section Controller · Traffic & Operations',
          route: 'control-office.html',
          desc: 'Real-time automatic block granting, train sequencing & overhead traction power isolation'
        },
        {
          key: 'surveillance',
          label: 'Surveillance Inspector',
          icon: '📡',
          color: '#34D399',
          dept: 'Track Safety & Telemetry Specialist',
          route: 'surveillance-dashboard.html',
          desc: 'Optical drone video analytics, vibration accelerometers & intrusion detection telemetry'
        }
      ];

      // 2. Specialized Maintenance Engineering Departments
      const MAINTENANCE_DEPARTMENTS = [
        {
          key: 'field-tms',
          label: 'TMS — Track Maintenance Dept',
          shortLabel: 'TMS (Track / P-Way)',
          icon: '🛤️',
          color: '#F59E0B',
          dept: 'Track Maintenance System (P-Way, Gang & Machines)',
          route: 'maintenance-dashboard.html',
          roleFilter: ['field-tms', 'field-engineer', 'admin']
        },
        {
          key: 'field-smms',
          label: 'SMMS — Signal & Telecom Dept',
          shortLabel: 'SMMS (Signal & S&T)',
          icon: '🚦',
          color: '#0284C7',
          dept: 'Signal Maintenance Management System (Interlocking & Points)',
          route: 'maintenance-dashboard.html',
          roleFilter: ['field-smms', 'field-engineer', 'admin']
        },
        {
          key: 'field-trd',
          label: 'TRD — Traction Distribution Dept',
          shortLabel: 'TRD (Traction & OHE)',
          icon: '⚡',
          color: '#EAB308',
          dept: 'Traction Power Supply & Overhead Equipment (OHE)',
          route: 'maintenance-dashboard.html',
          roleFilter: ['field-trd', 'field-engineer', 'admin']
        },
        {
          key: 'field-engineer',
          label: 'Senior Section Engineer (In-Charge)',
          shortLabel: 'Field Engineer (General / SSE)',
          icon: '🔧',
          color: '#D97706',
          dept: 'Multi-Disciplinary Maintenance & Section In-Charge',
          route: 'maintenance-dashboard.html',
          roleFilter: ['field-engineer', 'admin']
        }
      ];

      const { useState, useEffect, createElement: e } = window.React;

      function RoleLoginApp() {
        // View modes: 'main' | 'maintenance' | 'form'
        const [viewMode, setViewMode] = useState('main');
        const [selectedRole, setSelectedRole] = useState(null);
        const [username, setUsername] = useState('');
        const [password, setPassword] = useState('');
        const [showPassword, setShowPassword] = useState(false);
        const [error, setError] = useState('');
        const [success, setSuccess] = useState('');
        const [loading, setLoading] = useState(false);

        const handleSelectMainRole = (role) => {
          if (role.isMaintenanceGroup) {
            setViewMode('maintenance');
            setError('');
            return;
          }
          setSelectedRole(role);
          setViewMode('form');
          setUsername('');
          setPassword('');
          setError('');
          setSuccess('');
        };

        const handleSelectMaintenanceDept = (dept) => {
          setSelectedRole(dept);
          setViewMode('form');
          setUsername('');
          setPassword('');
          setError('');
          setSuccess('');
        };

        const handleBack = () => {
          if (viewMode === 'form') {
            if (selectedRole && selectedRole.key.startsWith('field-')) {
              setViewMode('maintenance');
            } else {
              setViewMode('main');
            }
            setSelectedRole(null);
          } else if (viewMode === 'maintenance') {
            setViewMode('main');
          }
          setUsername('');
          setPassword('');
          setError('');
          setSuccess('');
        };

        const handleSubmit = (ev) => {
          if (ev) ev.preventDefault();
          setError('');
          setSuccess('');

          if (!selectedRole) {
            setError('Please select an operational access role first.');
            return;
          }
          if (!username.trim()) {
            setError('Please enter your official username or Employee ID.');
            return;
          }
          if (!password) {
            setError('Please enter your password.');
            return;
          }

          setLoading(true);

          setTimeout(() => {
            try {
              let user = null;
              if (window.IR_UserStore && typeof window.IR_UserStore.authenticate === 'function') {
                user = window.IR_UserStore.authenticate(username.trim(), password);
              }

              if (!user) {
                setError('Invalid credentials. Please verify your username and password.');
                setLoading(false);
                return;
              }

              // Verify role permission
              const allowedRoles = selectedRole.roleFilter || [selectedRole.key, 'admin'];
              if (!allowedRoles.includes(user.role) && user.role !== 'admin') {
                setError(`Officer account '${user.username}' is assigned to role '${user.role}', which does not match '${selectedRole.label}'.`);
                setLoading(false);
                return;
              }

              // Create session payload
              const sessionData = {
                username: user.username,
                role: user.role,
                name: user.name || selectedRole.label,
                division: user.division || 'Northern Zone',
                loginTime: Date.now()
              };

              sessionStorage.setItem(SESSION_KEY, JSON.stringify(sessionData));
              sessionStorage.setItem(TOKEN_KEY, 'ir_tok_' + Math.random().toString(36).substring(2));

              setSuccess(`Access Authorized: Welcome, ${sessionData.name}. Launching Command Console...`);

              // Redirect
              const targetRoute = redirectUrl || selectedRole.route;
              setTimeout(() => {
                window.location.replace(targetRoute);
              }, 450);

            } catch (err) {
              setError(err.message || 'Authentication error encountered.');
              setLoading(false);
            }
          }, 320);
        };

        // Outer background container
        return e('div', {
          style: {
            minHeight: '100vh',
            width: '100%',
            display: 'flex',
            alignItems: 'center',
            justifyContent: 'center',
            padding: '16px',
            backgroundImage: "linear-gradient(135deg, rgba(3, 7, 18, 0.70) 0%, rgba(15, 23, 42, 0.50) 50%, rgba(3, 7, 18, 0.80) 100%), url('../vande_bharat_bg.jpg'), url('/frontend/vande_bharat_bg.jpg'), url('/vande_bharat_bg.jpg')",
            backgroundPosition: 'center',
            backgroundSize: 'cover',
            backgroundRepeat: 'no-repeat',
            backgroundAttachment: 'fixed',
            position: 'relative'
          }
        },
          // Center Frosted Glass Card
          e('div', {
            className: 'animate-fade-in',
            style: {
              width: '100%',
              maxWidth: '510px',
              background: 'rgba(15, 23, 42, 0.72)',
              backdropFilter: 'blur(28px)',
              WebkitBackdropFilter: 'blur(28px)',
              borderRadius: '20px',
              border: '1px solid rgba(255, 255, 255, 0.16)',
              boxShadow: '0 25px 50px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.20)',
              padding: '26px 28px',
              color: '#F8FAFC',
              position: 'relative'
            }
          },

            // High-Security Reload Logout Notification
            isReloadSecurity && e('div', {
              style: {
                marginBottom: '14px',
                padding: '9px 12px',
                borderRadius: '10px',
                background: 'rgba(249, 115, 22, 0.16)',
                border: '1px solid rgba(249, 115, 22, 0.45)',
                color: '#FDBA74',
                fontSize: '0.74rem',
                lineHeight: '1.35',
                display: 'flex',
                alignItems: 'center',
                gap: '8px'
              }
            },
              e('span', { style: { fontSize: '1.05rem', flexShrink: 0 } }, '🔒'),
              e('div', null,
                e('strong', { style: { color: '#FED7AA', display: 'block' } }, 'High-Security Automatic Logout'),
                'Session terminated upon page refresh as per Railway Security Protocol. Please select your role to sign in.'
              )
            ),

            // ═════════════════════════════════════════════════════════════════
            // SCREEN 1: PRIMARY ROLE SELECTION
            // ═════════════════════════════════════════════════════════════════
            viewMode === 'main' && e('div', null,
              // Top Badge
              e('div', { style: { textAlign: 'center', marginBottom: '18px' } },
                e('div', {
                  style: {
                    display: 'inline-flex',
                    alignItems: 'center',
                    gap: '6px',
                    fontSize: '0.68rem',
                    fontWeight: '800',
                    color: '#F97316',
                    letterSpacing: '1px',
                    textTransform: 'uppercase',
                    background: 'rgba(249, 115, 22, 0.15)',
                    border: '1px solid rgba(249, 115, 22, 0.35)',
                    padding: '4px 12px',
                    borderRadius: '16px',
                    boxShadow: '0 2px 6px rgba(249, 115, 22, 0.12)'
                  }
                },
                  e('span', null, '🛡️'),
                  e('span', null, 'Indian Railways Access Gateway')
                ),
                e('h1', {
                  style: {
                    fontSize: '1.45rem',
                    fontWeight: '800',
                    color: '#FFFFFF',
                    marginTop: '10px',
                    letterSpacing: '0.2px'
                  }
                }, 'Select Access Role'),
                e('p', {
                  style: {
                    fontSize: '0.80rem',
                    color: '#CBD5E1',
                    marginTop: '4px',
                    lineHeight: '1.4'
                  }
                }, 'Choose your operational command authority to enter the platform.')
              ),

              // Role Cards List
              e('div', { style: { display: 'flex', flexDirection: 'column', gap: '9px' } },
                MAIN_ROLES.map(r => e('div', {
                  key: r.key,
                  onClick: () => handleSelectMainRole(r),
                  style: {
                    display: 'flex',
                    alignItems: 'center',
                    justifyContent: 'space-between',
                    padding: '12px 14px',
                    borderRadius: '12px',
                    background: 'rgba(255, 255, 255, 0.08)',
                    border: '1px solid rgba(255, 255, 255, 0.13)',
                    cursor: 'pointer',
                    transition: 'all 0.18s cubic-bezier(0.16, 1, 0.3, 1)',
                    position: 'relative',
                    overflow: 'hidden'
                  },
                  onMouseEnter: (ev) => {
                    ev.currentTarget.style.background = 'rgba(255, 255, 255, 0.15)';
                    ev.currentTarget.style.borderColor = r.color;
                    ev.currentTarget.style.transform = 'translateY(-2px)';
                    ev.currentTarget.style.boxShadow = '0 8px 20px rgba(0, 0, 0, 0.35)';
                  },
                  onMouseLeave: (ev) => {
                    ev.currentTarget.style.background = 'rgba(255, 255, 255, 0.08)';
                    ev.currentTarget.style.borderColor = 'rgba(255, 255, 255, 0.13)';
                    ev.currentTarget.style.transform = 'none';
                    ev.currentTarget.style.boxShadow = 'none';
                  }
                },
                  e('div', { style: { display: 'flex', alignItems: 'center', gap: '12px', minWidth: 0, flex: 1 } },
                    e('div', {
                      style: {
                        width: '38px',
                        height: '38px',
                        borderRadius: '10px',
                        background: 'rgba(255, 255, 255, 0.12)',
                        border: '1px solid rgba(255, 255, 255, 0.20)',
                        display: 'flex',
                        alignItems: 'center',
                        justifyContent: 'center',
                        fontSize: '1.2rem',
                        flexShrink: 0
                      }
                    }, r.icon),
                    e('div', { style: { minWidth: 0, flex: 1, overflow: 'hidden' } },
                      e('div', {
                        style: {
                          fontSize: '0.90rem',
                          fontWeight: '700',
                          color: '#FFFFFF',
                          whiteSpace: 'nowrap',
                          overflow: 'hidden',
                          textOverflow: 'ellipsis'
                        }
                      }, r.label),
                      e('div', {
                        style: {
                          fontSize: '0.71rem',
                          color: '#94A3B8',
                          marginTop: '2px',
                          whiteSpace: 'nowrap',
                          overflow: 'hidden',
                          textOverflow: 'ellipsis'
                        }
                      }, r.dept)
                    )
                  ),
                  e('div', {
                    style: {
                      display: 'flex',
                      alignItems: 'center',
                      gap: '4px',
                      fontSize: '0.76rem',
                      fontWeight: '700',
                      color: '#60A5FA',
                      flexShrink: 0,
                      whiteSpace: 'nowrap',
                      marginLeft: '12px'
                    }
                  },
                    e('span', null, 'Sign In'),
                    e('span', { style: { fontSize: '0.88rem', lineHeight: '1' } }, '→')
                  )
                ))
              )
            ),

            // ═════════════════════════════════════════════════════════════════
            // SCREEN 1B: MAINTENANCE TEAMS (TMS, SMMS, TRD, GENERAL SSE)
            // ═════════════════════════════════════════════════════════════════
            viewMode === 'maintenance' && e('div', { className: 'animate-fade-in' },
              // Header with Back Button
              e('div', {
                style: {
                  display: 'flex',
                  alignItems: 'center',
                  justifyContent: 'space-between',
                  marginBottom: '16px'
                }
              },
                e('button', {
                  type: 'button',
                  onClick: handleBack,
                  style: {
                    display: 'flex',
                    alignItems: 'center',
                    gap: '5px',
                    background: 'rgba(255, 255, 255, 0.1)',
                    border: '1px solid rgba(255, 255, 255, 0.2)',
                    borderRadius: '8px',
                    padding: '5px 10px',
                    color: '#E2E8F0',
                    fontWeight: '700',
                    fontSize: '0.74rem',
                    cursor: 'pointer',
                    transition: 'all 0.15s ease'
                  },
                  onMouseEnter: (ev) => ev.currentTarget.style.background = 'rgba(255, 255, 255, 0.18)',
                  onMouseLeave: (ev) => ev.currentTarget.style.background = 'rgba(255, 255, 255, 0.1)'
                },
                  e('span', null, '←'),
                  e('span', null, 'Back to Access Roles')
                ),
                e('div', {
                  style: {
                    padding: '4px 11px',
                    borderRadius: '16px',
                    background: 'rgba(245, 158, 11, 0.15)',
                    border: '1px solid rgba(245, 158, 11, 0.4)',
                    color: '#FBBF24',
                    fontWeight: '700',
                    fontSize: '0.74rem'
                  }
                }, '🔧 Maintenance Wing')
              ),

              e('div', { style: { marginBottom: '16px', textAlign: 'center' } },
                e('h2', {
                  style: {
                    fontSize: '1.30rem',
                    fontWeight: '800',
                    color: '#FFFFFF',
                    letterSpacing: '0.2px'
                  }
                }, 'Select Maintenance Department'),
                e('p', {
                  style: {
                    fontSize: '0.78rem',
                    color: '#CBD5E1',
                    marginTop: '3px',
                    lineHeight: '1.4'
                  }
                }, 'Choose your specialized field engineering authority:')
              ),

              // Department Cards
              e('div', { style: { display: 'flex', flexDirection: 'column', gap: '9px' } },
                MAINTENANCE_DEPARTMENTS.map(d => e('div', {
                  key: d.key,
                  onClick: () => handleSelectMaintenanceDept(d),
                  style: {
                    display: 'flex',
                    alignItems: 'center',
                    justifyContent: 'space-between',
                    padding: '12px 14px',
                    borderRadius: '12px',
                    background: 'rgba(255, 255, 255, 0.08)',
                    border: '1px solid rgba(255, 255, 255, 0.13)',
                    cursor: 'pointer',
                    transition: 'all 0.18s cubic-bezier(0.16, 1, 0.3, 1)',
                    position: 'relative'
                  },
                  onMouseEnter: (ev) => {
                    ev.currentTarget.style.background = 'rgba(255, 255, 255, 0.15)';
                    ev.currentTarget.style.borderColor = d.color;
                    ev.currentTarget.style.transform = 'translateY(-2px)';
                    ev.currentTarget.style.boxShadow = '0 8px 20px rgba(0, 0, 0, 0.35)';
                  },
                  onMouseLeave: (ev) => {
                    ev.currentTarget.style.background = 'rgba(255, 255, 255, 0.08)';
                    ev.currentTarget.style.borderColor = 'rgba(255, 255, 255, 0.13)';
                    ev.currentTarget.style.transform = 'none';
                    ev.currentTarget.style.boxShadow = 'none';
                  }
                },
                  e('div', { style: { display: 'flex', alignItems: 'center', gap: '12px', minWidth: 0, flex: 1 } },
                    e('div', {
                      style: {
                        width: '38px',
                        height: '38px',
                        borderRadius: '10px',
                        background: 'rgba(255, 255, 255, 0.12)',
                        border: '1px solid rgba(255, 255, 255, 0.20)',
                        display: 'flex',
                        alignItems: 'center',
                        justifyContent: 'center',
                        fontSize: '1.2rem',
                        flexShrink: 0
                      }
                    }, d.icon),
                    e('div', { style: { minWidth: 0, flex: 1, overflow: 'hidden' } },
                      e('div', {
                        style: {
                          fontSize: '0.90rem',
                          fontWeight: '700',
                          color: '#FFFFFF',
                          whiteSpace: 'nowrap',
                          overflow: 'hidden',
                          textOverflow: 'ellipsis'
                        }
                      }, d.label),
                      e('div', {
                        style: {
                          fontSize: '0.70rem',
                          color: '#94A3B8',
                          marginTop: '2px',
                          whiteSpace: 'nowrap',
                          overflow: 'hidden',
                          textOverflow: 'ellipsis'
                        }
                      }, d.dept)
                    )
                  ),
                  e('div', {
                    style: {
                      display: 'flex',
                      alignItems: 'center',
                      gap: '4px',
                      fontSize: '0.76rem',
                      fontWeight: '700',
                      color: '#60A5FA',
                      flexShrink: 0,
                      whiteSpace: 'nowrap',
                      marginLeft: '12px'
                    }
                  },
                    e('span', null, 'Sign In'),
                    e('span', { style: { fontSize: '0.88rem', lineHeight: '1' } }, '→')
                  )
                ))
              )
            ),

            // ═════════════════════════════════════════════════════════════════
            // SCREEN 2: SIGN IN FORM (CLEAN, NO DEMO INFORMATION)
            // ═════════════════════════════════════════════════════════════════
            viewMode === 'form' && selectedRole && e('div', { className: 'animate-fade-in' },
              // Header with Back Button and Selected Role Badge
              e('div', {
                style: {
                  display: 'flex',
                  alignItems: 'center',
                  justifyContent: 'space-between',
                  marginBottom: '16px'
                }
              },
                e('button', {
                  type: 'button',
                  onClick: handleBack,
                  style: {
                    display: 'flex',
                    alignItems: 'center',
                    gap: '5px',
                    background: 'rgba(255, 255, 255, 0.1)',
                    border: '1px solid rgba(255, 255, 255, 0.2)',
                    borderRadius: '8px',
                    padding: '5px 10px',
                    color: '#E2E8F0',
                    fontWeight: '700',
                    fontSize: '0.74rem',
                    cursor: 'pointer',
                    transition: 'all 0.15s ease'
                  },
                  onMouseEnter: (ev) => ev.currentTarget.style.background = 'rgba(255, 255, 255, 0.18)',
                  onMouseLeave: (ev) => ev.currentTarget.style.background = 'rgba(255, 255, 255, 0.1)'
                },
                  e('span', null, '←'),
                  e('span', null, 'Change Authority')
                ),
                e('div', {
                  style: {
                    display: 'flex',
                    alignItems: 'center',
                    gap: '6px',
                    padding: '4px 11px',
                    borderRadius: '16px',
                    background: 'rgba(255, 255, 255, 0.12)',
                    border: '1px solid ' + selectedRole.color,
                    color: '#FFFFFF',
                    fontWeight: '700',
                    fontSize: '0.74rem'
                  }
                },
                  e('span', null, selectedRole.icon),
                  e('span', null, selectedRole.shortLabel || selectedRole.label)
                )
              ),

              // Title and Department text
              e('div', { style: { marginBottom: '16px' } },
                e('h2', {
                  style: {
                    fontSize: '1.30rem',
                    fontWeight: '800',
                    color: '#FFFFFF',
                    letterSpacing: '0.2px'
                  }
                }, `Sign In as ${selectedRole.shortLabel || selectedRole.label}`),
                e('p', {
                  style: {
                    fontSize: '0.78rem',
                    color: '#94A3B8',
                    marginTop: '3px',
                    lineHeight: '1.4'
                  }
                }, `Enter your authorized credentials for ${selectedRole.dept}.`)
              ),

              // Official Form (Clean, without demo credentials)
              e('form', { onSubmit: handleSubmit },
                // Username Input
                e('div', { style: { marginBottom: '12px' } },
                  e('label', {
                    style: {
                      display: 'block',
                      fontSize: '0.70rem',
                      fontWeight: '700',
                      color: '#CBD5E1',
                      textTransform: 'uppercase',
                      letterSpacing: '0.7px',
                      marginBottom: '6px'
                    }
                  }, 'Username / Employee ID'),
                  e('input', {
                    type: 'text',
                    className: 'gov-input',
                    value: username,
                    onChange: (ev) => setUsername(ev.target.value),
                    placeholder: 'Enter official username / employee ID',
                    autoFocus: true,
                    style: {
                      width: '100%',
                      padding: '10px 14px',
                      borderRadius: '10px',
                      border: '1px solid rgba(255, 255, 255, 0.22)',
                      background: 'rgba(15, 23, 42, 0.65)',
                      fontSize: '0.88rem',
                      color: '#FFFFFF',
                      outline: 'none',
                      boxShadow: 'inset 0 2px 4px rgba(0, 0, 0, 0.3)',
                      fontFamily: 'inherit'
                    }
                  })
                ),

                // Password Input
                e('div', { style: { marginBottom: '16px' } },
                  e('label', {
                    style: {
                      display: 'flex',
                      alignItems: 'center',
                      justifyContent: 'space-between',
                      fontSize: '0.70rem',
                      fontWeight: '700',
                      color: '#CBD5E1',
                      textTransform: 'uppercase',
                      letterSpacing: '0.7px',
                      marginBottom: '6px'
                    }
                  },
                    e('span', null, 'Password'),
                    e('button', {
                      type: 'button',
                      onClick: () => setShowPassword(!showPassword),
                      style: {
                        background: 'transparent',
                        border: 'none',
                        color: '#94A3B8',
                        cursor: 'pointer',
                        fontSize: '0.70rem',
                        fontWeight: '600'
                      }
                    }, showPassword ? 'Hide' : 'Show')
                  ),
                  e('input', {
                    type: showPassword ? 'text' : 'password',
                    className: 'gov-input',
                    value: password,
                    onChange: (ev) => setPassword(ev.target.value),
                    placeholder: 'Enter official password',
                    style: {
                      width: '100%',
                      padding: '10px 14px',
                      borderRadius: '10px',
                      border: '1px solid rgba(255, 255, 255, 0.22)',
                      background: 'rgba(15, 23, 42, 0.65)',
                      fontSize: '0.88rem',
                      color: '#FFFFFF',
                      outline: 'none',
                      boxShadow: 'inset 0 2px 4px rgba(0, 0, 0, 0.3)',
                      fontFamily: 'inherit'
                    }
                  })
                ),

                // Error message
                error && e('div', {
                  style: {
                    display: 'flex',
                    alignItems: 'center',
                    gap: '8px',
                    padding: '10px 12px',
                    borderRadius: '9px',
                    background: 'rgba(220, 38, 38, 0.22)',
                    border: '1px solid rgba(220, 38, 38, 0.45)',
                    color: '#FCA5A5',
                    fontSize: '0.78rem',
                    fontWeight: '600',
                    marginBottom: '14px'
                  }
                },
                  e('span', null, '⚠️'),
                  e('span', null, error)
                ),

                // Success message
                success && e('div', {
                  style: {
                    display: 'flex',
                    alignItems: 'center',
                    gap: '8px',
                    padding: '10px 12px',
                    borderRadius: '9px',
                    background: 'rgba(16, 185, 129, 0.22)',
                    border: '1px solid rgba(16, 185, 129, 0.45)',
                    color: '#6EE7B7',
                    fontSize: '0.78rem',
                    fontWeight: '600',
                    marginBottom: '14px'
                  }
                },
                  e('span', null, '✓'),
                  e('span', null, success)
                ),

                // Submit Button
                e('button', {
                  type: 'submit',
                  disabled: loading,
                  style: {
                    width: '100%',
                    padding: '11px',
                    borderRadius: '10px',
                    border: 'none',
                    background: 'linear-gradient(135deg, #F97316 0%, #EA580C 100%)',
                    color: '#FFFFFF',
                    fontSize: '0.90rem',
                    fontWeight: '800',
                    cursor: loading ? 'not-allowed' : 'pointer',
                    boxShadow: '0 6px 20px rgba(249, 115, 22, 0.35)',
                    letterSpacing: '0.3px',
                    transition: 'all 0.18s ease'
                  },
                  onMouseEnter: (ev) => {
                    if (!loading) ev.currentTarget.style.boxShadow = '0 8px 24px rgba(249, 115, 22, 0.55)';
                  },
                  onMouseLeave: (ev) => {
                    ev.currentTarget.style.boxShadow = '0 6px 20px rgba(249, 115, 22, 0.35)';
                  }
                },
                  loading ? 'Authenticating Officer Credentials...' : `Sign In to Corridor Command →`
                )
              )
            ),

            // Card Footer
            e('div', {
              style: {
                marginTop: '18px',
                paddingTop: '14px',
                borderTop: '1px solid rgba(255, 255, 255, 0.09)',
                textAlign: 'center',
                fontSize: '0.68rem',
                color: '#94A3B8',
                lineHeight: '1.5'
              }
            },
              e('div', null, 'Access restricted to authorized Indian Railways personnel.'),
              e('div', { style: { color: '#64748B', marginTop: '2px' } }, 'RAKSHA PATH v2.4.1 · High-Speed Corridor Command')
            )
          )
        );
      }

      // Mount React Application into #root
      const rootElement = document.getElementById('root');
      if (window.ReactDOM.createRoot) {
        window.ReactDOM.createRoot(rootElement).render(e(RoleLoginApp));
      } else if (window.ReactDOM.render) {
        window.ReactDOM.render(e(RoleLoginApp), rootElement);
      }
    })();
  </script>
</body>

</html>
